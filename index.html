<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AN Music | Anthony Nahas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #241050 0%, #090914 45%, #020205 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 35px 20px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 20px;
      border: 2px solid #9b7cff;
      box-shadow: 0 0 35px rgba(128, 82, 255, 0.65);
      background: rgba(255,255,255,0.05);
    }

    h1 {
      margin: 5px 0;
      font-size: 34px;
      letter-spacing: 3px;
    }

    .name {
      font-size: 20px;
      color: #cfc8ff;
      margin-bottom: 8px;
    }

    .tagline {
      color: #aaa;
      margin-bottom: 30px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 25px;
      border-radius: 25px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(155,124,255,0.55);
      box-shadow: 0 15px 50px rgba(0,0,0,0.4);
    }

    .card h2 {
      margin-top: 0;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      background: linear-gradient(135deg,#7048ff,#a14cff);
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.03);
    }

    .beatport {
      background: linear-gradient(135deg,#12c96d,#06a851);
    }

    footer {
      margin-top: 28px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="logo">AN</div>

    <h1>AN MUSIC</h1>

    <div class="name">Anthony Nahas</div>

    <div class="tagline">
      Electronic Music Producer
    </div>

    <section class="card">

      <h2>Welcome to my music world 🎵</h2>

      <p>
        Discover my releases, electronic music and latest projects.
      </p>

      <a class="button beatport"
         href="https://www.beatport.com/"
         target="_blank">
         Buy on Beatport
      </a>

      <a class="button"
         href="https://open.spotify.com/artist/4fjz7yFWeaNwiQH1SHCxHT"
         target="_blank">
         Listen on Spotify
      </a>

      <a class="button"
         href="https://youtube.com/channel/UC5TFdX07Eygrjvxwj4t0ADA"
         target="_blank">
         YouTube
      </a>

    </section>

    <footer>
      © 2026 Anthony Nahas • AN Music
    </footer>

  </main>

</body>
</html>
